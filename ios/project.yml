name: BaseHaptic
options:
  bundleIdPrefix: com.basehaptic
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    minorVersion: 2.5.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 13.2.0

targets:
  BaseHaptic:
    type: application
    platform: iOS
    sources:
      - path: mobile/BaseHaptic
      - path: shared/BaseHapticShared
    settings:
      base:
        INFOPLIST_FILE: mobile/BaseHaptic/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.basehaptic.app
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: BaseHaptic.entitlements
        DEVELOPMENT_TEAM: 8G4LG3694Q
      configs:
        Debug:
          BACKEND_BASE_URL: $(BASEHAPTIC_STAGING_BACKEND_BASE_URL)
          BACKEND_WS_URL: $(BASEHAPTIC_STAGING_BACKEND_WS_URL)
          SUPABASE_URL: $(BASEHAPTIC_STAGING_SUPABASE_URL)
          SUPABASE_ANON_KEY: $(BASEHAPTIC_STAGING_SUPABASE_ANON_KEY)
        Release:
          BACKEND_BASE_URL: https://baseballclassic-production-4796.up.railway.app
          BACKEND_WS_URL: wss://baseballclassic-production-4796.up.railway.app
          SUPABASE_URL: https://egcsxoxqfcwjjcvjycry.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_VTKZ4I3FS3COPXSe0dryjg_VDhg0D-a
    dependencies:
      - target: BaseHapticWatch Watch App
      - target: BaseHapticLiveActivity
        embed: true
      - package: supabase-swift
        product: Supabase
      - package: GoogleMobileAds
        product: GoogleMobileAds

  BaseHapticLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: liveactivity/BaseHapticLiveActivity
      - path: shared/BaseHapticShared
    settings:
      base:
        INFOPLIST_FILE: liveactivity/BaseHapticLiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.basehaptic.app.liveactivity
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        DEVELOPMENT_TEAM: 8G4LG3694Q

  BaseHapticWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: watch/BaseHapticWatch
    settings:
      base:
        INFOPLIST_FILE: watch/BaseHapticWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.basehaptic.app.watchkitapp
        MARKETING_VERSION: "1.1.4"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_WATCH_COMPANION: "YES"
        CODE_SIGN_ENTITLEMENTS: "BaseHapticWatch Watch App.entitlements"
        DEVELOPMENT_TEAM: 8G4LG3694Q
      configs:
        Debug:
          BACKEND_BASE_URL: $(BASEHAPTIC_STAGING_BACKEND_BASE_URL)
        Release:
          BACKEND_BASE_URL: https://baseballclassic-production-4796.up.railway.app

# BaseHapticLiveActivity는 ActivityKit/WidgetKit 기반 iOS Live Activity extension이다.
